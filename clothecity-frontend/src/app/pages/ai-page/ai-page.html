<div class="dashboard-layout">
  
  <aside class="sidebar">
    <ul>
      <li class="active">My products</li>
      <li>Sales</li>
      <li>Dealers</li>
      <li>Buyer list</li>
      <li>Rating</li>
    </ul>
    <div class="settings-link">Settings</div>
  </aside>

  <main class="main-content">
    <h2 class="page-title">Your Personal Ai</h2>
    
    <div class="ai-workspace">
      
      <div class="avatar-card">
        <div class="gender-toggle">
          <button class="active">Female</button>
          <button>Male</button>
        </div>

        <div class="avatar-view">
          <model-viewer 
            src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
            alt="3D avatar" 
            auto-rotate 
            camera-controls>
          </model-viewer>
        </div>

        <div class="ai-chat-box">
          <div class="chat-header">
            <span class="logo-icon-small">C</span> Clothfy Ai
          </div>
          <div class="chat-input-area">
            <input type="text" placeholder="Choose your style with Clothfy">
            <button class="send-btn">➤</button>
          </div>
        </div>
      </div>

      <div class="clothes-grid">
        <div class="item-card">
          <img src="assets/black-jacket.png" alt="Black Jacket" class="item-img">
          <div class="item-details">
            <h4>Black Jacket</h4>
            <p>Outerwear</p>
            <div class="price-row">
              <span class="price">$129.99</span>
              <button class="add-btn">Add to Cart</button>
            </div>
          </div>
        </div>
        </div>

    </div>
  </main>
</div>
