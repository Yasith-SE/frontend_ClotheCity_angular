<div class="full-page-wrapper">
  <app-navbar></app-navbar>

  <div class="dashboard-layout">
    <app-sidebar></app-sidebar>

    <main class="main-content">
      <h1 class="page-title">Your Personal Ai</h1>
      
      <div class="ai-workspace">
        <div class="avatar-card">
          <div class="gender-toggle">
            <button class="active">Female</button>
            <button>Male</button>
          </div>

          <div class="avatar-view">
            <model-viewer 
              [src]="currentAvatar" 
              alt="3D avatar" 
              auto-rotate 
              camera-controls>
            </model-viewer>
          </div>

          <div class="ai-chat-box">
            <div class="chat-header">
              <span class="logo-icon-small">C</span> Clothfy Ai
              <span *ngIf="isGenerating" style="font-size: 0.7rem; color: #0056b3; margin-left: auto;">Generating...</span>
            </div>
            <div class="chat-input-area">
              <input 
                type="text" 
                placeholder="Choose your style with Clothfy"
                [(ngModel)]="promptText"
                (keyup.enter)="generateAiStyle()"
                [disabled]="isGenerating">
              <button class="send-btn" (click)="generateAiStyle()" [disabled]="isGenerating">
                <i class="fa-solid fa-paper-plane"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="clothes-grid">
          <div class="item-card" (click)="changeClothes('leather-jacket')" style="cursor: pointer;">
            <div class="img-placeholder"></div>
            <div class="item-details">
              <h4>Black Jacket</h4>
              <p>Outerwear</p>
              <div class="price-row">
                <span class="price">$129.99</span>
                <button class="add-btn">Add to Cart</button>
              </div>
            </div>
          </div>
          
          <div class="item-card" (click)="changeClothes('red-dress')" style="cursor: pointer;">
            <div class="img-placeholder" style="background-color: darkred;"></div>
            <div class="item-details">
              <h4>Red Dress</h4>
              <p>Outerwear</p>
              <div class="price-row">
                <span class="price">$129.99</span>
                <button class="add-btn">Add to Cart</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>
