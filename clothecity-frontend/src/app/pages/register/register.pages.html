<div class="auth-container">
  <div class="branding-panel">
    <div class="logo-area">
      <span class="logo-icon">C</span>
      <h2>Clothe<span class="text-blue">City</span></h2>
    </div>
  </div>

  <div class="form-panel">
    <div class="form-wrapper">
      <h3>Create Account</h3>
      
      <form>
        <input type="text" placeholder="Username" class="custom-input">
        <input type="email" placeholder="User Email" class="custom-input">
        
        <div class="password-wrapper">
          <input type="password" placeholder="Password" class="custom-input">
          <span class="eye-icon">👁️</span>
        </div>
        
        <input type="password" placeholder="Confirm Password" class="custom-input">
        <input type="text" placeholder="Postal code" class="custom-input">
        
        <button type="submit" class="action-btn">Join</button>
      </form>
    </div>
  </div>
</div>
