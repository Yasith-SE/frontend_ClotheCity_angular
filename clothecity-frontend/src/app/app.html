<div class="site-shell">
  <header class="site-header">
    <div class="container-xxl d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
      <a class="brand-lockup site-brand" routerLink="/auth">
        <span class="brand-badge">C</span>
        <span>
          <span class="brand-name d-block">ClotheCity</span>
          <small class="site-brand-copy">Angular showcase</small>
        </span>
      </a>

      <nav class="site-nav">
        @for (link of pageLinks; track link.route) {
          <a
            class="site-nav-link"
            [routerLink]="link.route"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ link.label }}
          </a>
        }
      </nav>
    </div>
  </header>

  <main class="site-main">
    <router-outlet></router-outlet>
  </main>
</div>
